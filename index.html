<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sudoku</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>9</text></svg>" />
</head>
<body>
  <main class="app">
    <header class="header">
      <h1 class="title">Sudoku</h1>
      <div class="header-right">
        <div class="stats">
          <div class="stat">
            <span class="stat-label">Tiempo</span>
            <span class="stat-value" id="timer">00:00</span>
          </div>
          <div class="stat">
            <span class="stat-label">Errores</span>
            <span class="stat-value" id="errors">0/3</span>
          </div>
        </div>
        <button class="theme-btn" id="themeBtn" aria-label="Cambiar tema" title="Cambiar tema"></button>
        <button class="pause-btn" id="pauseBtn" aria-label="Pausar" title="Pausar (Esc)">⏸</button>
      </div>
    </header>

    <section class="difficulty">
      <button class="difficulty-btn active" data-level="easy">Fácil</button>
      <button class="difficulty-btn" data-level="medium">Medio</button>
      <button class="difficulty-btn" data-level="hard">Difícil</button>
      <button class="difficulty-btn" data-level="impossible">Imposible</button>
    </section>

    <section class="board-wrap">
      <div class="board" id="board" aria-label="Tablero de sudoku"></div>
      <div class="pause-overlay hidden" id="pauseOverlay">
        <div class="pause-card">
          <h2>Pausa</h2>
          <p>El juego está en pausa</p>
          <button class="action-btn" id="resumeBtn">Continuar</button>
        </div>
      </div>
    </section>

    <section class="notes">
      <label class="notes-toggle">
        <input type="checkbox" id="notesMode" />
        <span>Modo notas</span>
      </label>
    </section>

    <section class="controls">
      <button class="action-btn" id="eraseBtn">Borrar</button>
      <button class="action-btn" id="hintBtn">Pista</button>
      <button class="action-btn" id="undoBtn">Deshacer</button>
      <button class="action-btn danger" id="newBtn">Nuevo juego</button>
    </section>

    <section class="numpad">
      <button class="num-btn" data-num="1">1</button>
      <button class="num-btn" data-num="2">2</button>
      <button class="num-btn" data-num="3">3</button>
      <button class="num-btn" data-num="4">4</button>
      <button class="num-btn" data-num="5">5</button>
      <button class="num-btn" data-num="6">6</button>
      <button class="num-btn" data-num="7">7</button>
      <button class="num-btn" data-num="8">8</button>
      <button class="num-btn" data-num="9">9</button>
    </section>
  </main>

  <div class="modal hidden" id="modal">
    <div class="modal-content">
      <h2 id="modalTitle"></h2>
      <p id="modalText"></p>
      <button class="action-btn" id="modalBtn">Jugar de nuevo</button>
    </div>
  </div>

  <div class="modal hidden" id="confirmModal">
    <div class="modal-content">
      <h2>¿Nuevo juego?</h2>
      <p id="confirmText">Perderás el progreso actual. ¿Quieres empezar de nuevo?</p>
      <div class="modal-actions">
        <button class="action-btn" id="cancelBtn">Cancelar</button>
        <button class="action-btn danger" id="confirmBtn">Sí, empezar</button>
      </div>
    </div>
  </div>

  <div class="mascot" id="mascot">
    <div class="mascot-bubble" id="mascotBubble">
      <span id="mascotMsg"></span>
    </div>
    <div class="mascot-dog" aria-hidden="true">
      <svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 44 Q12 20 28 12 Q42 16 40 34 Z" fill="#31313a"/>
        <path d="M80 44 Q88 20 72 12 Q58 16 60 34 Z" fill="#31313a"/>
        <ellipse cx="50" cy="90" rx="22" ry="15" fill="#ffffff" stroke="#d8d3ce" stroke-width="1.5"/>
        <ellipse cx="50" cy="93" rx="10" ry="8" fill="#d99a5b" opacity="0.8"/>
        <ellipse cx="50" cy="50" rx="31" ry="28" fill="#ffffff" stroke="#d8d3ce" stroke-width="1.5"/>
        <path d="M22 34 C26 24 36 22 44 27 C51 34 48 46 40 50 C30 51 24 44 22 34 Z" fill="#31313a"/>
        <ellipse cx="70" cy="50" rx="9" ry="7" fill="#d99a5b"/>
        <circle cx="37" cy="40" r="3.4" fill="#1d1d24"/>
        <circle cx="36" cy="39" r="1" fill="#ffffff"/>
        <circle cx="63" cy="40" r="3.4" fill="#1d1d24"/>
        <circle cx="62" cy="39" r="1" fill="#ffffff"/>
        <ellipse cx="50" cy="60" rx="7" ry="5.5" fill="#1d1d24"/>
        <ellipse cx="48" cy="58" rx="2" ry="1.2" fill="#ffffff" opacity="0.5"/>
        <path d="M50 65 C44 71 36 69 33 64 M50 65 C56 71 64 69 67 64" stroke="#1d1d24" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <path d="M50 66 C48 70 49 74 50 74 C51 74 52 70 50 66 Z" fill="#f28b82"/>
      </svg>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
